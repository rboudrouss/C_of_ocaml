name: emcc-setup
description: >
  emsdk, c_of_ocaml built by dune, and the sysroot of ocaml-emcc for the
  target (the OCaml runtime compiled by emcc), in the opam switch of
  setup-ocaml. Needs $EMSDK, and OPAMKEEPBUILDDIR=true when the switch is
  created.

inputs:
  target:
    description: wasm32 or wasm64
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      with:
        path: ${{ env.EMSDK }}
        key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}
    - name: Install emsdk
      shell: bash
      run: |
        [ -d "$EMSDK" ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
        "$EMSDK/emsdk" install "$EMSDK_VERSION"
        "$EMSDK/emsdk" activate "$EMSDK_VERSION"
        echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
    - name: Build c_of_ocaml
      shell: bash
      run: |
        opam install -y --deps-only ./c_of_ocaml.opam
        opam install -y ocamlfind
        opam exec -- dune build compiler/bin-c_of_ocaml/c_of_ocaml.exe
    - name: Build the sysroot of ocaml-emcc
      shell: bash
      run: |
        # ocaml-emcc depends on c_of_ocaml: the one of this tree, with its
        # version (a pin without one is ~dev, which ocaml-emcc refuses)
        version=$(sed -n 's/^let version = "\(.*\)"$/\1/p' compiler/bin-c_of_ocaml/c_of_ocaml.ml)
        opam pin add -n -y "c_of_ocaml.$version" .
        opam pin add -y ocaml-emcc "$OCAML_EMCC"
        opam exec -- ocaml-emcc --target ${{ inputs.target }} setup
